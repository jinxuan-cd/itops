# =============================================================================
#  IT 运维工单台账与日报系统
#  -----------------------------------------------------------------------------
#  三个容器，两个对外端口：
#    frontend   管理端（内网）  -> ${ADMIN_PORT:-8080}    完整后台，登录后使用
#    public-web 员工自助（公网）-> ${PUBLIC_PORT:-8090}   只有报障/查询/常见问题
#    backend    后端 API        -> 不映射宿主机端口，两个前端容器共用
#    db         MySQL           -> 不映射宿主机端口，只在容器网络内可见
#
#  两个前端入口反代的是同一个 backend、同一个数据库，数据天然互通，
#  不需要任何同步或桥接。公网端口只放行 /api/public/*，其余路径直接 404。
#
#  ⚠ 改端口：编辑同目录 .env 里的 ADMIN_PORT / PUBLIC_PORT，然后**必须重建**：
#       docker compose up -d --force-recreate
#    （docker compose restart 不会更新端口映射，这是"改了 env 不生效"的常见原因）
# =============================================================================

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-itops_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-itops}
      MYSQL_USER: ${MYSQL_USER:-itops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itops_2026}
      # 时区必须与业务本地时间一致，否则 NOW() 与工单时间差 8 小时（会出现「已挂 -7h」的怪值）
      TZ: Asia/Shanghai
    # 服务器默认时区固定为东八区：NOW()/CURDATE() 全部按北京时间
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-itops_root_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - itops-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Shanghai
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-itops}
      DB_USER: ${MYSQL_USER:-itops}
      DB_PASSWORD: ${MYSQL_PASSWORD:-itops_2026}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_prod}
      # 首次启动创建的管理员初始口令（用户表为空时生效）
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /app/uploads
      # 备份包存放目录（挂卷，重建容器不丢）
      BACKUP_DIR: /app/backups
      # 本地 AI 服务在宿主机时：容器内用 host.docker.internal 访问宿主机
      IN_DOCKER: "1"
      AI_LOCALHOST_ALIAS: ${AI_LOCALHOST_ALIAS:-host.docker.internal}
    extra_hosts:
      # 让 Linux 宿主机也能解析 host.docker.internal（Docker Desktop 默认已支持）
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itops-net

  # ===========================================================================
  #  管理端（内网）：完整后台界面，映射 ADMIN_PORT，只给内网电脑/手机访问
  #  不要把这个端口映射到公网；公网只开 public-web
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - itops-net

  # ===========================================================================
  #  员工自助门户（公网）：独立端口，独立静态站
  #  只提供报障 / 查进度 / 满意度 / 常见问题，nginx 仅反代 /api/public/*
  #  映射 PUBLIC_PORT，由宝塔 WAF / 域名指向这个端口
  # ===========================================================================
  public-web:
    build:
      context: ./public-portal
    restart: unless-stopped
    ports:
      # 只有这个端口需要映射到公网（云服务器安全组 / 路由器端口转发）
      - "${PUBLIC_PORT:-8090}:80"
    depends_on:
      - backend
    networks:
      - itops-net

volumes:
  db_data:

networks:
  itops-net:
    driver: bridge
