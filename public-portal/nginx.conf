# =============================================================================
#  员工自助门户（公网网关）
#  -----------------------------------------------------------------------------
#  这个 nginx 是**唯一**可以对公网暴露的入口，只做三件事：
#    1. 返回门户静态页面（报障 / 查进度 / 常见问题）
#    2. 反代 /api/public/* 到公网后端进程
#    3. 其它一切请求（含 /api/auth、/api/tickets、/uploads 等管理接口）直接 404
#  真正的第二道防线在后端：公网进程以 PUBLIC_ONLY=1 启动，压根没注册管理接口。
# =============================================================================

# 按 IP 限流：报障提交 6 次/分钟，其它公开接口 60 次/分钟
limit_req_zone $binary_remote_addr zone=pub_report:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pub_api:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # 公网入口禁止被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # 不允许被 iframe 嵌套，避免点击劫持
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # 门户自身不需要加载任何外部资源，收紧 CSP
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 门户只接受读与提交，其余方法一律拒绝
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 512;

    # ------------------------- 静态门户 -------------------------
    location / {
        # 门户是单页：/report、/faq 等路径统一回退到 index.html
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ------------------------- 报障提交（单独限流） -------------------------
    location = /api/public/report {
        limit_req zone=pub_report burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-public:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ------------------------- 其它公开接口 -------------------------
    location /api/public/ {
        limit_req zone=pub_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-public:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ------------------------- 明确拒绝的区域 -------------------------
    # 管理接口、上传文件、实时推送等一律不对外开放
    location /api/ {
        return 404;
    }
    location /uploads/ {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
}
